</style></head><body>
<div id="login"><div class="box"><div class="logo">Net<span>Learn</span></div><p class="mut">Network toolkit, modul belajar &amp; helpdesk</p>
<label>Username</label><input id="lu" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password">
<div class="err" id="le"></div><button style="width:100%" onclick="login()">Masuk</button>
<p class="mut" style="text-align:center">Belum punya akun? <a href="#" onclick="reg();return false" style="color:var(--ac)">Daftar</a></p>
</div></div>
<div id="app"><nav class="side" id="nav"></nav><main id="main"></main></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $=s=>document.querySelector(s),L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let users=L('nl_users',[{u:'admin',p:'admin123',r:'admin'},{u:'user',p:'user123',r:'user'}]),tickets=L('nl_tix',[]),cfg=L('nl_cfg',{wa:'6285813123254',site:'https://example.com',ssh:'root@192.168.1.1'}),me=null;
function save(){S('nl_users',users);S('nl_tix',tickets);S('nl_cfg',cfg)}
try{me=JSON.parse(sessionStorage.getItem('nl_me'))}catch(e){}
function login(){const u=users.find(x=>x.u===$('#lu').value.trim()&&x.p===$('#lp').value);if(!u){$('#le').textContent='Username atau password salah';return}me=u;try{sessionStorage.setItem('nl_me',JSON.stringify(u))}catch(e){}start()}
function reg(){const u=prompt('Username baru:');if(!u)return;const p=prompt('Password (min 6 karakter):');if(!p||p.length<6)return alert('Password terlalu pendek');if(users.some(x=>x.u===u))return alert('Username sudah dipakai');users.push({u,p,r:'user'});save();alert('Akun dibuat, silakan login')}
function logout(){try{sessionStorage.removeItem('nl_me')}catch(e){}location.reload()}
const userNav=[['home','Beranda'],['vlsm','VLSM'],['tpl','Template Config'],['ports','Referensi Port'],['ip','Kalkulator IP'],['topo','Topologi & Config'],['mod','Modul Belajar'],['help','Bantuan / Kontak']],
adminNav=[['home','Ringkasan'],['tix','Tiket Client'],['usr','Pengguna'],['remote','Remote Web'],['vlsm','VLSM'],['tpl','Template Config'],['ports','Referensi Port'],['ip','Kalkulator IP'],['topo','Topologi & Config'],['mod','Modul Belajar'],['set','Password & Pengaturan']];
function start(){$('#login').style.display='none';$('#app').style.display='block';const n=me.r==='admin'?adminNav:userNav;
$('#nav').innerHTML='<div class="logo">Net<span>Learn</span></div><p class="mut">'+me.u+' <span class="tag">'+me.r+'</span></p>'+n.map(x=>`<a data-p="${x[0]}" onclick="go('${x[0]}')">${x[1]}</a>`).join('')+'<a onclick="logout()" style="color:#dc2626">Keluar</a>';go('home')}
function go(p){document.querySelectorAll('#nav a[data-p]').forEach(a=>a.classList.toggle('on',a.dataset.p===p));$('#main').innerHTML=P[p]();I[p]&&I[p]();scrollTo(0,0)}
const P={},I={};
// ---------- IP ----------
const ip2n=s=>{const p=s.trim().split('.').map(Number);return p.length!==4||p.some(x=>!(x>=0&&x<=255)||isNaN(x))?null:((p[0]<<24)>>>0)+(p[1]<<16)+(p[2]<<8)+p[3]},n2ip=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
function calc(s){const m=s.trim().match(/^([\d.]+)\/(\d{1,2})$/);if(!m)return null;const ip=ip2n(m[1]),p=+m[2];if(ip===null||p>32)return null;const mask=p?(0xFFFFFFFF<<(32-p))>>>0:0,net=(ip&mask)>>>0,bc=(net|(~mask>>>0))>>>0,h=p>=31?(p==32?1:2):Math.pow(2,32-p)-2,o=ip>>>24;
return{ip:m[1],p,mask:n2ip(mask),wc:n2ip(~mask>>>0),net:n2ip(net),bc:n2ip(bc),first:p>=31?n2ip(net):n2ip(net+1),last:p>=31?n2ip(bc):n2ip(bc-1),h,cls:o<128?'A':o<192?'B':o<224?'C':o<240?'D (Multicast)':'E',priv:/^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(m[1])?'Private':'Public',bin:n2ip(ip).split('.').map(x=>(+x).toString(2).padStart(8,'0')).join('.'),netn:net}}
P.ip=()=>`<h2>Kalkulator IP &amp; Subnetting</h2><div class="card"><label>IP / CIDR</label><div class="row"><input id="ipin" value="192.168.10.25/26" oninput="doIp()"><input id="sub" type="number" min="1" max="32" placeholder="Pecah ke prefix /... (opsional)" oninput="doIp()"></div><div id="ipout"></div></div>`;
I.ip=()=>doIp();
function doIp(){const c=calc($('#ipin').value);if(!c){$('#ipout').innerHTML='<p class="err">Format: 192.168.1.10/24</p>';return}
const r=[['Network',c.net],['Broadcast',c.bc],['Subnet Mask',c.mask+' (/'+c.p+')'],['Wildcard',c.wc],['Range Host',c.first+' - '+c.last],['Jumlah Host',c.h.toLocaleString()],['Kelas / Tipe',c.cls+' / '+c.priv],['Biner IP',c.bin]];
let h='<div class="kv">'+r.map(x=>`<b>${x[0]}</b><span>${x[1]}</span>`).join('')+'</div>';const q=+$('#sub').value;
if(q>c.p&&q<=32){const n=Math.pow(2,q-c.p),sz=Math.pow(2,32-q);h+=`<h3>${n} subnet /${q}</h3><div class="scroll"><table><tr><th>#</th><th>Network</th><th>Range host</th><th>Broadcast</th></tr>`;for(let i=0;i<Math.min(n,64);i++){const a=c.netn+i*sz;h+=`<tr><td>${i+1}</td><td>${n2ip(a)}/${q}</td><td>${n2ip(a+(q<31?1:0))} - ${n2ip(a+sz-(q<31?2:1))}</td><td>${n2ip(a+sz-1)}</td></tr>`}h+='</table></div>'}
$('#ipout').innerHTML=h}
// ---------- Topologi ----------
let lans=[{n:'LAN-A',net:'192.168.10.0/24',pc:2},{n:'LAN-B',net:'192.168.20.0/24',pc:2}];
P.topo=()=>`<h2>Topologi &amp; Generator Config</h2><div class="card"><div id="lanf"></div><div class="row"><button class="sec" onclick="lans.push({n:'LAN-'+(lans.length+1),net:'10.0.'+lans.length+'.0/24',pc:2});I.topo()">+ Tambah LAN</button><select id="vendor" onchange="draw()"><option value="cisco">Cisco IOS</option><option value="mt">MikroTik</option><option value="linux">Linux (ip / iptables)</option></select><select id="dh" onchange="draw()"><option value="1">Dengan DHCP</option><option value="0">Tanpa DHCP</option></select></div></div>
<div class="card"><div id="svg" class="scroll"></div></div><div class="card"><div class="row" style="justify-content:space-between"><h3>Config Router</h3><button class="sec" style="flex:0" onclick="navigator.clipboard&&navigator.clipboard.writeText($('#cfg').textContent)">Salin</button></div><pre id="cfg"></pre></div>`;
I.topo=()=>{$('#lanf').innerHTML=lans.map((l,i)=>`<div class="row"><input value="${l.n}" onchange="lans[${i}].n=this.value;draw()"><input value="${l.net}" onchange="lans[${i}].net=this.value;draw()"><input type="number" min="0" max="4" value="${l.pc}" onchange="lans[${i}].pc=+this.value;draw()"><button class="red xb" title="Hapus LAN" onclick="lans.splice(${i},1);I.topo()">&#10005;</button></div>`).join('');draw()};
function draw(){const W=lans.length*210+20,cs=lans.map(l=>calc(l.net)),vd=$('#vendor').value,dh=$('#dh').value==='1';
let s=`<svg viewBox="0 0 ${W} 330" width="${Math.max(W,400)}" font-size="12" fill="currentColor"><g stroke="#818cf8" stroke-width="2">`,cx=W/2;
lans.forEach((l,i)=>{const x=i*210+110;s+=`<line x1="${cx}" y1="55" x2="${x}" y2="130"/><line x1="${x}" y1="160" x2="${x}" y2="215" stroke-width="0"/>`;for(let k=0;k<l.pc;k++){const px=x-70+k*47;s+=`<line x1="${x}" y1="160" x2="${px+20}" y2="235"/>`}});
s+=`</g><rect x="${cx-45}" y="15" width="90" height="40" rx="10" fill="#4f46e5"/><text x="${cx}" y="40" fill="#fff" text-anchor="middle">Router R1</text>`;
lans.forEach((l,i)=>{const x=i*210+110,c=cs[i];s+=`<rect x="${x-40}" y="130" width="80" height="30" rx="8" fill="#06b6d4"/><text x="${x}" y="150" fill="#fff" text-anchor="middle">Switch</text><text x="${x}" y="115" text-anchor="middle" font-weight="700">${l.n}</text><text x="${x}" y="127" text-anchor="middle" fill="#888" font-size="10">${c?c.net+'/'+c.p:'?'}</text>`;

const IN=['Linux adalah sistem operasi yang dipakai di hampir semua server dan perangkat jaringan, jadi wajib dikuasai. Di modul ini kamu belajar bekerja lewat terminal: berpindah folder, mengelola file dan izin akses, memeriksa konfigurasi jaringan, serta menjalankan dan memantau service. Setiap perintah disertai contoh yang bisa langsung kamu coba di Ubuntu atau Debian.',
'Model OSI membagi proses komunikasi data menjadi 7 lapisan supaya setiap masalah bisa dilacak per lapisan. Saat data dikirim, ia dibungkus (encapsulation) dari layer 7 sampai 1, lalu dibuka kembali oleh penerima. TCP/IP adalah versi ringkasnya dengan 4 lapisan. Dengan memahami OSI kamu tahu harus mulai mencari masalah dari mana: kabel, IP, port, atau aplikasi.',
'Routing adalah proses router menentukan jalur terbaik agar paket sampai ke jaringan tujuan. Router membaca tabel routing yang berisi rute connected, static (dibuat manual), atau dynamic (dipelajari otomatis lewat protokol seperti OSPF). Di modul ini kamu belajar membuat rute, default route, OSPF dasar, serta VLAN dan routing antar VLAN.',
'Troubleshooting adalah cara sistematis menemukan penyebab jaringan bermasalah. Mulailah dari lapisan bawah: kabel dan link, lalu IP dan gateway, kemudian DNS, terakhir firewall dan aplikasi. Dengan alur yang konsisten dan perintah seperti ping, traceroute, dan nslookup, kamu bisa mempersempit masalah dengan cepat tanpa menebak-nebak.',
'Subnetting memecah satu jaringan besar menjadi beberapa jaringan kecil agar penggunaan IP efisien, broadcast lebih terkontrol, dan keamanan lebih baik. Kuncinya memahami prefix (/24, /26, dan seterusnya), jumlah host, dan blok subnet. Gunakan menu Kalkulator IP dan VLSM untuk memeriksa hitungan manualmu.',
'DHCP memberi IP, gateway, dan DNS ke client secara otomatis, sedangkan DNS menerjemahkan nama domain menjadi alamat IP. Keduanya penting agar pengguna tidak perlu mengatur jaringan manual. Kamu akan belajar proses DORA, jenis record DNS, cara query dengan dig dan nslookup, serta membuat server DHCP dan DNS sederhana dengan dnsmasq.',
'Keamanan jaringan melindungi data dan layanan dari akses yang tidak sah. Prinsipnya: izinkan hanya yang dibutuhkan, pisahkan jaringan, dan pantau aktivitas. Modul ini membahas firewall (ufw dan iptables), pengamanan SSH, serta jenis serangan di layer 2 beserta cara mencegahnya di switch.',
'MikroTik adalah router populer di Indonesia karena harganya terjangkau dan fitur RouterOS-nya lengkap. Konfigurasi bisa lewat Winbox, WebFig, atau terminal. Kamu belajar setup awal (IP, DHCP client, NAT masquerade, DNS), pembatasan bandwidth dengan queue, hotspot, dan cara membuat backup konfigurasi.',
'Web server menyajikan website dan aplikasi ke pengguna. Nginx sering dipakai sebagai web server sekaligus reverse proxy yang meneruskan permintaan ke aplikasi di belakangnya. Kamu belajar membuat konfigurasi server block, memasang HTTPS gratis dengan Certbot, memantau resource server, dan menjadwalkan tugas dengan cron.',
'Jaringan wireless memakai gelombang radio (WiFi), sedangkan VPN membuat terowongan terenkripsi lewat internet agar komunikasi aman. Kamu akan memahami standar WiFi, pemilihan channel agar tidak bentrok, keamanan WPA2 dan WPA3, serta membuat VPN modern dengan WireGuard.',
'Cisco IOS adalah sistem operasi perangkat Cisco dan menjadi standar belajar CCNA. Konfigurasi dilakukan lewat CLI dengan beberapa mode (user, privileged, global config, interface). Kamu belajar berpindah mode, memakai perintah show untuk memeriksa kondisi perangkat, dan menyimpan konfigurasi supaya tidak hilang saat reboot.',
'Dasar fisik jaringan: jenis kabel dan fungsi perangkat. Straight-through dipakai untuk menghubungkan perangkat berbeda jenis, crossover untuk sejenis, console untuk konfigurasi CLI, dan fiber untuk jarak jauh. Kamu juga belajar perbedaan hub, switch, dan router serta kategori kabel UTP. Praktikkan dengan membuat topologi di menu Topologi & Config.',
'IPv6 adalah pengganti IPv4 dengan alamat 128 bit sehingga jumlahnya hampir tidak terbatas. Penulisannya heksadesimal dan bisa disingkat. Tidak ada broadcast, dan satu LAN biasanya memakai prefix /64. Kamu belajar jenis alamat, aturan penyingkatan, dan konfigurasi dasar di router dan Linux.',
'VLAN memisahkan satu switch fisik menjadi beberapa jaringan logis, STP mencegah loop di jaringan switch, dan EtherChannel menggabungkan beberapa kabel menjadi satu jalur yang lebih cepat dan redundan. Ketiganya adalah inti desain jaringan kantor yang stabil dan teratur.',
'Saat ping dan perintah dasar tidak cukup, kamu perlu menganalisis lebih dalam. Modul ini memakai tcpdump untuk menangkap paket, mtr dan nmap untuk memeriksa jalur dan port, iperf3 untuk mengukur bandwidth, serta checklist verifikasi di perangkat Cisco.',
'Monitoring memberi tahu kamu jika ada perangkat atau layanan bermasalah sebelum pengguna mengeluh. Kamu akan mengenal SNMP dan tool seperti Zabbix. Docker membungkus aplikasi dalam container agar mudah dipasang di mana saja, dan backup otomatis menjaga data tetap aman.',
'BGP adalah protokol routing antar organisasi (Autonomous System) yang menjadi tulang punggung internet. Berbeda dengan OSPF yang mencari jalur tercepat, BGP memilih jalur berdasarkan kebijakan dan atribut. Modul ini mengenalkan eBGP dan iBGP, pemilihan jalur, serta pengembangan OSPF seperti area dan redistribusi.',
'Lanjutan dari keamanan dasar: VPN antar kantor (site-to-site) dan akses jarak jauh, strategi pertahanan berlapis, serta pemeriksaan keamanan sederhana dengan nmap dan log. Tujuannya membangun jaringan yang tetap aman walau satu lapisan pertahanan berhasil ditembus.',
'Wireshark menampilkan isi paket yang lewat di jaringan sehingga kamu bisa melihat langsung apa yang terjadi. Dengan display filter kamu menyaring paket tertentu, lalu membaca tanda masalah seperti retransmission, RST, atau DNS lambat. Gunakan hanya di jaringan milikmu atau dengan izin.',
'Mengelola server berarti mengatur pengguna, hak akses, penyimpanan, dan service dengan rapi. Kamu belajar membuat user dan grup, mengatur permission, memahami disk dan LVM agar penyimpanan mudah diperbesar, serta mengelola dan memeriksa service lewat systemd dan journalctl.',
'Virtualisasi menjalankan banyak server virtual dalam satu mesin fisik, dan cloud menyewakan sumber daya itu lewat internet. Kamu belajar tipe hypervisor, mode jaringan VM (NAT, Bridge, Host-only), model IaaS, PaaS, dan SaaS, serta dasar pengamanan VPS.',
'Peta belajar menuju sertifikasi CCNA: topik yang diujikan dan cara belajar yang efektif. Gunakan semua fitur di web ini sebagai latihan: Kalkulator IP, VLSM, Topologi & Config, dan Template Config.'];
const EX=['<p><b>Struktur direktori.</b> Semua berawal dari / (root). /etc menyimpan konfigurasi, /var/log berisi log, /home folder pengguna, /usr program, /tmp file sementara.</p><p><b>Izin akses.</b> rwx untuk pemilik, grup, dan lainnya. Angka 755 berarti pemilik boleh semuanya, yang lain hanya baca dan eksekusi. 644 umum untuk file biasa.</p><p><b>Tips.</b> Pakai Tab untuk melengkapi perintah, panah atas untuk riwayat, man nama-perintah untuk bantuan, dan sudo hanya saat perlu.</p><p><b>Kesalahan umum:</b> memakai rm -r tanpa mengecek path, mengedit konfigurasi tanpa backup (cp file file.bak), dan lupa restart service setelah mengubah konfigurasi.</p>',
'<ul><li><b>7 Application</b>: layanan yang dipakai pengguna (HTTP, DNS, SMTP).</li><li><b>6 Presentation</b>: format dan enkripsi data (TLS).</li><li><b>5 Session</b>: membuka dan menutup sesi.</li><li><b>4 Transport</b>: TCP/UDP, nomor port, segment.</li><li><b>3 Network</b>: IP, routing, packet.</li><li><b>2 Data Link</b>: MAC, switch, VLAN, frame.</li><li><b>1 Physical</b>: kabel, sinyal, bit.</li></ul><p><b>Encapsulation:</b> data menjadi segment, packet, frame, lalu bit. Penerima membukanya dari bawah ke atas.</p><p><b>Contoh kasus:</b> website tidak terbuka. Cek layer 1 (kabel), layer 3 (ping gateway), lalu layer 7 (DNS dan browser).</p>',
'<p>Router memilih rute dengan prefix terpanjang (paling spesifik), lalu administrative distance (connected 0, static 1, OSPF 110, RIP 120), lalu metric. Default route 0.0.0.0/0 dipakai bila tidak ada rute yang cocok.</p><p><b>Static:</b> cocok untuk jaringan kecil, tapi tidak menyesuaikan sendiri saat link putus. <b>Dynamic:</b> router saling bertukar informasi dan menyesuaikan otomatis.</p><p><b>Cek rute:</b> show ip route (Cisco), ip route (Linux), /ip route print (MikroTik). Masalah umum: lupa rute balik, sehingga ping terkirim tapi tidak ada balasan.</p>',
'<ol><li>Cek fisik: lampu link, kabel, port.</li><li>Cek IP dengan ipconfig atau ip a. Alamat 169.254.x.x berarti DHCP gagal.</li><li>Ping gateway, lalu ping 8.8.8.8, lalu ping nama domain.</li><li>Jika ping IP berhasil tapi domain gagal, masalahnya di DNS.</li><li>Pakai traceroute untuk melihat di hop mana paket terhenti.</li><li>Cek firewall dan port layanan.</li></ol><p>Catat apa yang sudah dicoba, ubah satu hal dalam satu waktu, dan tes ulang setiap perubahan.</p>',
'<p><b>Langkah cepat:</b> tentukan prefix, lalu hitung ukuran blok = 256 dikurangi nilai oktet mask. Contoh /26 = mask 255.255.255.192, blok 64, sehingga subnet: .0, .64, .128, .192.</p><p><b>Host valid</b> = 2^(32-prefix) dikurangi 2. Alamat pertama adalah network, terakhir adalah broadcast. Contoh 192.168.1.70/26: network .64, broadcast .127, host .65 sampai .126.</p><p><b>VLSM:</b> urutkan kebutuhan host dari terbesar, beri blok sesuai kebutuhan, lalu lanjut ke alamat berikutnya agar tidak tumpang tindih.</p>',
'<p><b>DHCP DORA:</b> Discover (client mencari server), Offer (server menawarkan IP), Request (client meminta), Acknowledge (server menyetujui). Lease adalah masa pakai IP; client memperbarui di 50% masa lease.</p><p><b>DNS:</b> client bertanya ke resolver, resolver bertanya ke root, TLD, lalu server otoritatif. Hasil disimpan sementara (cache) sesuai TTL.</p><p><b>Masalah umum:</b> dua DHCP server di satu jaringan (rogue DHCP), pool IP habis, atau DNS salah sehingga internet terasa mati padahal ping IP berhasil. Cek dengan nslookup dan dig.</p>',
'<p><b>Prinsip:</b> least privilege (beri akses seperlunya), defense in depth (pertahanan berlapis), dan default deny (blokir semua, izinkan yang perlu).</p><ul><li><b>Firewall:</b> aturan dibaca dari atas ke bawah, aturan pertama yang cocok dipakai.</li><li><b>SSH:</b> nonaktifkan login root dan password, pakai kunci SSH, ubah port bila perlu.</li><li><b>Layer 2:</b> port security untuk MAC flooding, DHCP snooping untuk rogue DHCP, DAI untuk ARP spoofing.</li></ul><p>Selalu update sistem dan simpan log untuk investigasi.</p>',
'<p>Akses lewat Winbox, WebFig, SSH, atau Terminal. Login awal biasanya admin tanpa password, jadi segera ganti password.</p><p><b>Alur setup internet:</b> 1) beri IP di interface LAN, 2) DHCP client di interface WAN, 3) NAT masquerade ke WAN, 4) set DNS, 5) DHCP server untuk LAN.</p><p><b>Tips:</b> buat backup sebelum mengubah konfigurasi (/system backup save), pakai Safe Mode di Winbox supaya perubahan batal otomatis bila koneksi terputus, dan beri comment pada setiap rule.</p>',
'<p><b>Alur:</b> browser meminta domain, DNS menjawab IP, browser terhubung ke port 80 atau 443, lalu web server mengirim halaman. Reverse proxy menerima permintaan dan meneruskannya ke aplikasi (misal Node atau PHP) di port lain.</p><p><b>Langkah deploy:</b> arahkan domain ke IP server, pasang Nginx, buat server block, tes dengan nginx -t, reload, lalu pasang HTTPS dengan Certbot.</p><p><b>Perawatan:</b> pantau log di /var/log/nginx, perbarui paket berkala, dan jadwalkan backup dengan cron.</p>',
'<ul><li><b>2.4 GHz:</b> jangkauan luas, rawan interferensi, gunakan channel 1, 6, atau 11.</li><li><b>5 GHz:</b> lebih cepat, jangkauan lebih pendek.</li><li><b>Keamanan:</b> pakai WPA2-AES atau WPA3, hindari WEP dan WPS.</li></ul><p><b>VPN:</b> membungkus dan mengenkripsi lalu lintas dalam terowongan. WireGuard memakai pasangan kunci publik dan privat, konfigurasinya singkat dan cepat. Pastikan port UDP VPN dibuka di firewall dan IP forwarding aktif di server.</p>',
'<p><b>Mode:</b> Router> (user EXEC), ketik enable menjadi Router# (privileged), ketik configure terminal menjadi Router(config)#, lalu interface g0/0 menjadi Router(config-if)#. exit naik satu level, end kembali ke privileged.</p><p><b>Penting:</b> running-config ada di RAM dan hilang saat reboot. Simpan dengan write memory. Awali perintah dengan no untuk membatalkannya, misal no shutdown mengaktifkan port.</p><p>Status interface up/up berarti normal, up/down biasanya masalah layer 2, administratively down berarti belum di-no shutdown.</p>',
'<ul><li><b>Straight-through:</b> PC ke switch, router ke switch.</li><li><b>Crossover:</b> PC ke PC, switch ke switch, router ke router, PC ke router. Perangkat modern punya Auto-MDIX sehingga menyesuaikan otomatis.</li><li><b>Console (rollover):</b> dari PC ke port console untuk konfigurasi awal.</li><li><b>Fiber:</b> single-mode untuk jarak jauh, multi-mode untuk jarak pendek.</li></ul><p>Batas UTP 100 meter. Cat5e hingga 1 Gbps, Cat6 hingga 10 Gbps jarak pendek. Switch memisahkan collision domain per port; router memisahkan broadcast domain.</p>',
'<p><b>Aturan singkat:</b> hapus nol di depan tiap grup, dan ganti satu rangkaian grup nol berturut-turut dengan ::, hanya boleh sekali. Alamat 2001:0db8:0000:0000:0000:0000:0000:0001 menjadi 2001:db8::1.</p><p><b>Jenis:</b> global unicast (2000::/3) seperti IP publik, link-local (fe80::/10) otomatis ada di tiap interface, multicast (ff00::/8) pengganti broadcast. SLAAC memungkinkan host membentuk alamatnya sendiri dari prefix router.</p><p>Banyak jaringan memakai dual-stack, yaitu IPv4 dan IPv6 berjalan bersamaan.</p>',
'<p><b>VLAN:</b> setiap VLAN adalah broadcast domain terpisah. Komunikasi antar VLAN butuh router atau switch layer 3. Port access membawa satu VLAN, port trunk membawa banyak VLAN dengan tag 802.1Q. Native VLAN tidak diberi tag, samakan di kedua ujung trunk.</p><p><b>STP:</b> memilih satu root bridge lalu memblokir link berlebih agar tidak terjadi loop. Tanpa STP, broadcast storm bisa melumpuhkan jaringan.</p><p><b>EtherChannel:</b> beberapa kabel menjadi satu link logis. Mode LACP (active atau passive) harus cocok di kedua sisi.</p>',
'<p><b>tcpdump:</b> menangkap paket di server tanpa GUI. Pakai filter (host, port) agar hasil tidak terlalu banyak, simpan ke file .pcap lalu analisis di Wireshark.</p><p><b>mtr:</b> gabungan ping dan traceroute yang menampilkan packet loss per hop. <b>iperf3:</b> mengukur throughput antara dua titik; jalankan server di satu sisi dan client di sisi lain.</p><p><b>Pola kasus:</b> lambat di jam tertentu (cek bandwidth dan loop), putus-putus (cek kabel, duplex mismatch, interferensi WiFi), hanya satu situs bermasalah (cek DNS, MTU, firewall).</p>',
'<p><b>Monitoring:</b> tentukan apa yang dipantau (uptime, CPU, RAM, traffic, suhu), ambang batas, dan siapa yang diberi notifikasi. SNMP v3 lebih aman dari v2c karena ada autentikasi dan enkripsi.</p><p><b>Docker:</b> image adalah cetakan, container adalah instance yang berjalan. Data penting disimpan di volume agar tidak hilang saat container dihapus. docker compose menjalankan banyak container lewat satu file.</p><p><b>Backup:</b> terapkan aturan 3-2-1 (3 salinan, 2 media berbeda, 1 di lokasi lain) dan uji restore secara berkala.</p>',
'<p><b>Konsep:</b> setiap organisasi punya nomor AS. Tetangga BGP dibentuk manual lewat perintah neighbor dan bertukar prefix lewat TCP port 179. Atribut penting: weight (Cisco, lokal), local preference, AS-path terpendek, dan MED.</p><p><b>OSPF lanjutan:</b> area 0 wajib sebagai backbone dan area lain terhubung ke area 0. Router ID menjadi identitas router. Pada jaringan broadcast dipilih DR dan BDR. Redistribusi memasukkan rute dari protokol lain ke OSPF.</p><p>Cek hubungan dengan show ip bgp summary dan show ip ospf neighbor.</p>',
'<p><b>IPsec:</b> fase 1 membangun saluran aman antar peer (autentikasi dan enkripsi), fase 2 membangun terowongan data. Kedua ujung harus punya parameter yang sama: enkripsi, hash, DH group, dan pre-shared key.</p><p><b>IDS/IPS:</b> Snort atau Suricata mendeteksi (dan memblokir) pola serangan. <b>Segmentasi:</b> pisahkan server, karyawan, dan tamu di VLAN berbeda lalu batasi dengan ACL.</p><p><b>Checklist:</b> ganti password bawaan, matikan layanan yang tidak dipakai, update firmware, aktifkan logging, dan scan port berkala pada jaringan sendiri.</p>',
'<p><b>Cara pakai:</b> pilih interface, klik Start, lakukan aktivitas yang ingin dianalisis, lalu Stop. Terapkan display filter. Klik kanan paket lalu Follow TCP Stream untuk melihat percakapan lengkap.</p><ul><li><b>SYN tanpa balasan:</b> port tertutup atau diblokir firewall.</li><li><b>RST:</b> koneksi ditolak atau diputus.</li><li><b>Retransmission dan duplicate ACK:</b> paket hilang.</li><li><b>Banyak ARP:</b> ada loop atau perangkat bermasalah.</li></ul><p>Data tanpa enkripsi seperti HTTP dan FTP bisa terbaca, alasan kuat untuk memakai HTTPS dan SSH.</p>',
'<p><b>User dan grup:</b> buat user dengan adduser, tambahkan ke grup dengan usermod -aG. File web biasanya dimiliki www-data. Hindari memakai root untuk pekerjaan harian.</p><p><b>LVM:</b> disk fisik (PV) digabung menjadi volume group (VG), lalu dibagi menjadi logical volume (LV) yang bisa diperbesar tanpa membongkar disk.</p><p><b>Systemd:</b> kelola service dengan systemctl, lihat log dengan journalctl -u nama-service, dan cek service gagal dengan systemctl --failed. Pantau disk dengan df -h dan du -sh, karena disk penuh sering menjadi penyebab service mati.</p>',
'<p><b>Mode jaringan VM:</b> NAT (VM keluar lewat IP host, tidak bisa diakses dari luar), Bridge (VM seperti perangkat sendiri di LAN), Host-only (hanya bisa dengan host).</p><p><b>Model layanan:</b> IaaS memberi server virtual (kamu kelola OS), PaaS memberi platform siap pakai, SaaS memberi aplikasi jadi.</p><p><b>Keamanan VPS:</b> pakai kunci SSH, aktifkan firewall dan security group, update rutin, dan jangan membuka port database ke internet. Pantau biaya dan matikan resource yang tidak dipakai.</p>',
'<p><b>Garis besar topik:</b> network fundamentals, network access (VLAN, STP, WLAN), IP connectivity (routing, OSPF), IP services (NAT, DHCP, NTP, SNMP), security fundamentals, dan automation. Cek blueprint resmi Cisco untuk bobot terbaru.</p><p><b>Rencana belajar:</b> pelajari teori satu topik, praktikkan di simulator, catat command show penting, lalu kerjakan soal latihan. Ulangi subnetting sampai bisa dihitung tanpa kalkulator.</p><p>Gunakan Template Config sebagai contoh, lalu ubah parameternya sendiri.</p>'];

if(sq){const m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;w=h=max}else{const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k)}
